name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build and lint release
        run: bash ./gradlew assembleRelease lintRelease
      - name: Upload unsigned release for signing
        uses: actions/upload-artifact@v7
        with:
          name: AniTrack-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload release lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-lint
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
