name: Android

on:
  push:
    branches: [main, 'checkpoint/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Test and build
        env:
          ANITRACK_LIVE_TESTS: 'true'
        run: bash ./gradlew test lintDebug lintRelease assembleDebug assembleRelease
      - name: Collect release tools
        run: |
          mkdir -p release-tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" "$ANDROID_HOME/build-tools/36.0.0/aapt" release-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" release-tools/lib/
          if [ -d "$ANDROID_HOME/build-tools/36.0.0/lib64" ]; then cp -R "$ANDROID_HOME/build-tools/36.0.0/lib64" release-tools/; fi
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: AniTrack-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload release tools
        uses: actions/upload-artifact@v7
        with:
          name: release-tools
          path: release-tools/
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: AniTrack-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
            app/schemas/
          if-no-files-found: ignore
